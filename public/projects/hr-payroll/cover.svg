<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- window -->
  <rect x="120" y="90" width="1360" height="720" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="120" y="90" width="1360" height="48" rx="18" fill="#1e293b"/>
  <rect x="120" y="120" width="1360" height="18" fill="#1e293b"/>
  <circle cx="152" cy="114" r="7" fill="#ef4444"/><circle cx="176" cy="114" r="7" fill="#f59e0b"/><circle cx="200" cy="114" r="7" fill="#22c55e"/>
  <text x="800" y="120" fill="#94a3b8" font-size="16" text-anchor="middle">HR &amp; Payroll System</text>
  <!-- sidebar -->
  <rect x="120" y="138" width="230" height="672" fill="#0b1324"/>
  <g fill="#94a3b8" font-size="17">
    <rect x="140" y="170" width="190" height="40" rx="8" fill="#1d4ed8"/>
    <text x="160" y="196" fill="#fff">Dashboard</text>
    <text x="160" y="250">Employees</text>
    <text x="160" y="300">Attendance</text>
    <text x="160" y="350">Overtime</text>
    <text x="160" y="400">Payroll</text>
    <text x="160" y="450">Loans &amp; Advances</text>
    <text x="160" y="500">Reports</text>
    <text x="160" y="550">Bank Export</text>
  </g>
  <!-- stat cards -->
  <g font-size="15">
    <rect x="390" y="170" width="250" height="120" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="414" y="205" fill="#94a3b8">Present Today</text>
    <text x="414" y="260" fill="#fff" font-size="40" font-weight="700">142</text>
    <rect x="660" y="170" width="250" height="120" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="684" y="205" fill="#94a3b8">OT Hours (Month)</text>
    <text x="684" y="260" fill="#fff" font-size="40" font-weight="700">1,284</text>
    <rect x="930" y="170" width="250" height="120" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="954" y="205" fill="#94a3b8">EPF / ETF</text>
    <text x="954" y="260" fill="#fff" font-size="40" font-weight="700">8·12·3%</text>
    <rect x="1200" y="170" width="250" height="120" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="1224" y="205" fill="#94a3b8">Device Sync</text>
    <circle cx="1234" cy="248" r="8" fill="#22c55e"/>
    <text x="1252" y="256" fill="#fff" font-size="26" font-weight="600">Online</text>
  </g>
  <!-- chart -->
  <rect x="390" y="320" width="520" height="460" rx="12" fill="#111c33" stroke="#1e293b"/>
  <text x="414" y="358" fill="#e2e8f0" font-size="18" font-weight="600">Weekly Attendance</text>
  <g fill="url(#bar)">
    <rect x="440" y="520" width="44" height="220" rx="6"/>
    <rect x="510" y="470" width="44" height="270" rx="6"/>
    <rect x="580" y="500" width="44" height="240" rx="6"/>
    <rect x="650" y="440" width="44" height="300" rx="6"/>
    <rect x="720" y="480" width="44" height="260" rx="6"/>
    <rect x="790" y="600" width="44" height="140" rx="6" fill="#334155"/>
  </g>
  <!-- payroll table -->
  <rect x="930" y="320" width="520" height="460" rx="12" fill="#111c33" stroke="#1e293b"/>
  <text x="954" y="358" fill="#e2e8f0" font-size="18" font-weight="600">Payroll Run</text>
  <g font-size="15" fill="#94a3b8">
    <text x="954" y="400">EMP</text><text x="1080" y="400">BASIC</text><text x="1210" y="400">OT</text><text x="1330" y="400">NET</text>
  </g>
  <line x1="954" y1="414" x2="1426" y2="414" stroke="#1e293b" stroke-width="2"/>
  <g font-size="15" fill="#cbd5e1">
    <text x="954" y="452">E-0012</text><text x="1080" y="452">48,000</text><text x="1210" y="452">6,750</text><text x="1330" y="452">49,110</text>
    <text x="954" y="500">E-0027</text><text x="1080" y="500">42,500</text><text x="1210" y="500">3,980</text><text x="1330" y="500">42,780</text>
    <text x="954" y="548">E-0031</text><text x="1080" y="548">55,000</text><text x="1210" y="548">9,200</text><text x="1330" y="548">58,400</text>
    <text x="954" y="596">E-0044</text><text x="1080" y="596">39,000</text><text x="1210" y="596">2,150</text><text x="1330" y="596">37,970</text>
  </g>
  <rect x="954" y="690" width="220" height="50" rx="10" fill="#1d4ed8"/>
  <text x="1064" y="722" fill="#fff" font-size="16" text-anchor="middle" font-weight="600">Print Payslips</text>
  <rect x="1190" y="690" width="236" height="50" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="1308" y="722" fill="#cbd5e1" font-size="16" text-anchor="middle" font-weight="600">Bank Transfer File</text>
</svg>
